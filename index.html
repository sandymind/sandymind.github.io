<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandy Mind</title>
<style>
  :root { color-scheme: light dark; --fg: #1c2b24; --muted: #5e6e66; --accent: #0b5d3b; --bg: #ffffff; --card: #f3f7f5; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6efe9; --muted: #a3b3ab; --accent: #6fd3a3; --bg: #111a15; --card: #1a261f; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { margin: 0; letter-spacing: .2em; font-size: 1.6rem; }
  .muted { color: var(--muted); }
  .app { background: var(--card); border-radius: 16px; padding: 20px; margin-top: 32px; }
  .app h2 { margin: 0 0 4px; font-size: 1.15rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>SANDY MIND</h1>
  <p class="muted">Aplikasi Android dari Palu, Sulawesi Tengah.</p>

  <section class="app">
    <h2>Waktu Sholat: Azan &amp; Zikir</h2>
    <p class="muted">Jadwal sholat, azan tepat waktu, zikir dan tasbih digital. Tanpa internet, tanpa iklan.</p>
    <a href="waktusholat/privacy/">Kebijakan Privasi</a>
  </section>
</main>
</body>
</html>
